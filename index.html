<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninebot Max BLE Controller</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #1a1f2e 0%, #0d1117 45%, #010409 100%);
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: 1.5;
}
.container {
  width: min(96%, 800px);
  margin: auto;
  padding: 24px 16px 60px;
}
.header {
  margin-bottom: 24px;
}
.brand {
  color: #7d8590;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
h1 {
  margin: 8px 0;
  font-size: 32px;
  font-weight: 600;
}
.subtitle {
  color: #7d8590;
  font-size: 14px;
}
.card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.card-title {
  color: #e6edf3;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #7d8590;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #484f58;
  transition: all 0.2s;
}
.dot.connected { background: #3fb950; box-shadow: 0 0 10px #3fb950; }
.dot.error { background: #f85149; }
.dot.pending { background: #d29922; animation: pulse 1.5s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
button {
  border: 0;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  background: #238636;
  color: white;
}
button:hover:not(:disabled) { filter: brightness(1.1); }
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
button.secondary {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
}
button.secondary:hover:not(:disabled) {
  background: #30363d;
  border-color: #8b949e;
}
button.danger {
  background: #da3633;
}
button.large {
  width: 100%;
  padding: 16px;
  font-size: 16px;
  margin-bottom: 10px;
}
.button-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.button-group button {
  flex: 1;
  min-width: 140px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media(max-width: 600px) {
  .grid-2 { grid-template-columns: 1fr; }
  .button-group button { min-width: 100%; }
}
.scooter-visual {
  text-align: center;
  font-size: 64px;
  margin: 20px 0;
}
.lock-display {
  text-align: center;
  padding: 30px 20px;
  background: #0d1117;
  border: 2px solid #30363d;
  border-radius: 14px;
  margin-bottom: 16px;
}
.lock-icon {
  font-size: 56px;
  margin-bottom: 12px;
}
.lock-status {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}
.lock-status.locked { color: #f85149; }
.lock-status.unlocked { color: #3fb950; }
.lock-status.unknown { color: #7d8590; }
.lock-detail {
  color: #7d8590;
  font-size: 13px;
}
pre {
  margin: 0;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 16px;
  color: #a5d6ff;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
}
.uuid-box {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
  font-family: monospace;
  font-size: 12px;
  color: #a5d6ff;
  word-break: break-all;
}
.uuid-label {
  color: #7d8590;
  font-size: 11px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.hidden { display: none; }
select {
  background: #0d1117;
  border: 1px solid #30363d;
  color: #e6edf3;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 12px;
  width: 100%;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="brand">Ninebot Max Commercial</div>
    <h1>🛴 BLE Controller</h1>
    <div class="subtitle">Direct lock/unlock control for Ryder v.8 / Max fleet scooters</div>
  </div>

  <!-- CONNECTION STATUS -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Connection</div>
      <div class="status-indicator">
        <span id="dot" class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </div>
    
    <div class="scooter-visual">🛴</div>
    
    <button id="connectBtn" class="large" onclick="connect()">
      🔵 Connect to Scooter
    </button>
    <button id="disconnectBtn" class="large secondary hidden" onclick="disconnect()">
      Disconnect
    </button>
  </div>

  <!-- LOCK CONTROL -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Lock Control</div>
    </div>
    
    <div class="lock-display">
      <div id="lockIcon" class="lock-icon">⚪</div>
      <div id="lockStatus" class="lock-status unknown">UNKNOWN</div>
      <div id="lockDetail" class="lock-detail">Connect to control scooter</div>
    </div>

    <div style="margin-bottom: 12px;">
      <div style="color:#7d8590; font-size:12px; margin-bottom:4px;">Target Board</div>
      <select id="targetSelect">
        <option value="0x20">ESC (0x20) - Electronic Speed Controller</option>
        <option value="0x21">Dashboard (0x21) - Display/BLE Module</option>
      </select>
    </div>

    <div class="button-group">
      <button id="unlockBtn" style="background: #238636;" onclick="sendUnlock()" disabled>
        🔓 Unlock
      </button>
      <button id="lockBtn" class="danger" onclick="sendLock()" disabled>
        🔒 Lock
      </button>
    </div>
  </div>

  <!-- DEVICE INFO -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Device</div>
    </div>
    <div class="grid-2">
      <div>
        <div style="color:#7d8590; font-size:12px; margin-bottom:4px;">Name</div>
        <div id="deviceName" style="font-weight:600;">Not connected</div>
      </div>
      <div>
        <div style="color:#7d8590; font-size:12px; margin-bottom:4px;">ID</div>
        <div id="deviceId" style="font-family:monospace; font-size:12px;">—</div>
      </div>
    </div>
  </div>

  <!-- BLE INTERFACE -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">BLE Interface (Nordic UART)</div>
    </div>
